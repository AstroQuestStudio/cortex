name: Cortex missed
description: Cortex did not find what grep + reading found. Misses on open-source code become benchmark questions.
labels: [relevance]
body:
  - type: input
    id: question
    attributes:
      label: Question asked
      placeholder: where are signed cookies verified
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected answer (file, and symbol if relevant)
      placeholder: src/utils/cookie.ts#verifySignature
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository and commit (if public)
      placeholder: https://github.com/honojs/hono @ 7c3b0df
  - type: textarea
    id: output
    attributes:
      label: What Cortex returned
      description: Output of `cortex find "<question>"` (the first lines are enough).
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cortex --version
    validations:
      required: true
